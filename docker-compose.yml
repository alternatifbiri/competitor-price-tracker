services:
  tracker:
    build: .
    container_name: price-tracker
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - TZ=Europe/Istanbul
      # Credentials, set these in your host's secret store rather than here:
      # - TELEGRAM_BOT_TOKEN=
      # - TELEGRAM_CHAT_ID=
      # - SMTP_HOST=
      # - SMTP_USER=
      # - SMTP_PASSWORD=
      # - SMTP_TO=
      # Alternatively keep the whole config on the volume:
      # - CONFIG_PATH=/data/config.json
    volumes:
      - tracker_data:/data
    # The service does no work by itself. Scheduled tasks exec into it:
    #   python tracker.py --run
    #   python tracker.py --report
    command: ["sleep", "infinity"]

volumes:
  tracker_data:
